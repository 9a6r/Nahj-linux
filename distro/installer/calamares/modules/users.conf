---
defaultGroups: [wheel, video, audio, input, storage]
autologinGroup: ""
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doAutologin: false
allowWeakPasswords: true
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8
  maxLength: -1
user:
  shell: /bin/bash
  home_permissions: '0700'
  forbidden_names: [root, nobody, sddm]
