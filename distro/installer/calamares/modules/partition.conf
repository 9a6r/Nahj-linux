---
efi:
  mountPoint: /boot/efi
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: EFI
defaultFileSystemType: ext4
availableFileSystemTypes: [ext4]
initialPartitioningChoice: none
initialSwapChoice: none
userSwapChoices: [none, file]
# Keep this first image's disk layout deliberately bounded and testable.
# No preselected erase action; the user must choose a disk/layout and confirm.
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
