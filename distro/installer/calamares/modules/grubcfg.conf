---
overwrite: true
prefer_grub_d: false
keep_distributor: false
kernel_params: [quiet, splash, loglevel=3, rd.udev.log_level=3, vt.global_cursor_default=0]
defaults:
  GRUB_TIMEOUT: 3
  GRUB_DEFAULT: '0'
  GRUB_DISTRIBUTOR: Nahj
  GRUB_GFXMODE: auto
  GRUB_GFXPAYLOAD_LINUX: keep
  GRUB_TERMINAL_OUTPUT: gfxterm
  GRUB_DISABLE_SUBMENU: true
  GRUB_DISABLE_RECOVERY: false
