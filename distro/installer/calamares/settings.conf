---
modules-search: [local]
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec:
      - partition
      - mount
      - unpackfs
      - nahjtarget
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - fstab
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - services-systemd
      - umount
  - show: [finished]
branding: nahj
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
