# Proxy: a combat HUD. Near-black glass, hazard yellow for the accent; the drawers wear slanted
# plates with a green-to-yellow health bar, a data pill, a hazard-stripe rail and round ability buttons.
name = "Proxy"
tagline = "Combat HUD"
base = "proxy"
font = "Titan One"
corner_rounding = 6

[palette]
ink    = "#f2f6f8"
faint  = "#93a1ac"
mint   = "#ffd21f"
mintlo = "#d9a400"
minthi = "#fff07a"
onmint = "#0b0d10"
tint   = "#10161d"
panel  = "#121920"
deep   = "#2a8cff"
off    = "#2a323b"
alert  = "#ff4d6d"

[card]
colors = ["#0a0e13", "#121920", "#2a8cff", "#ffd21f", "#43e23a"]
